name: Build Trigger Rally (Foolproof)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y libsdl2-dev:arm64 libsdl2-image-dev:arm64 libglew-dev:arm64 libphysfs-dev:arm64 libopenal-dev:arm64 libalut-dev:arm64 libtinyxml2-dev:arm64 libglu1-mesa-dev:arm64

      - name: Inject Headers
        run: |
          # Finde den Ordner, in dem SDL.h liegt
          SDL_PATH=$(find /usr/aarch64-linux-gnu -name SDL.h | head -n 1 | xargs dirname)
          echo "SDL gefunden unter: $SDL_PATH"
          
          # Erstelle den Ordner, den der Code erwartet: src/include/SDL2
          mkdir -p src/include/SDL2
          
          # Kopiere ALLE SDL2 Header direkt in den include-Pfad des Projekts.
          # Das löst das "SDL2/SDL.h" Problem für immer.
          cp -L $SDL_PATH/*.h src/include/SDL2/
          
          # Wiederhole das für andere Libs, falls nötig (Beispiel für SDL_image)
          IMG_PATH=$(find /usr/aarch64-linux-gnu -name SDL_image.h | head -n 1 | xargs dirname)
          cp -L $IMG_PATH/*.h src/include/SDL2/

      - name: Build Binary
        run: |
          cd src
          
          # Wir brauchen NUR das lokale ./include, da wir die Dateien gerade dorthin kopiert haben
          # Das macht das Build-System extrem stabil.
          MY_CPPFLAGS="-I./include -DNDEBUG -DUNIX"
          
          # Die LDFLAGS müssen wir behalten, damit die Libs gelinkt werden
          MY_LDFLAGS="-L/usr/aarch64-linux-gnu/lib/aarch64-linux-gnu -lSDL2 -lSDL2_image -lGL -lGLU -lGLEW -lphysfs -lopenal -lalut -ltinyxml2 -lpthread"
          
          make CC=aarch64-unknown-linux-gnu-gcc \
               CXX=aarch64-unknown-linux-gnu-g++ \
               OPTIMS="-O3 -mtune=cortex-a35" \
               CPPFLAGS="$MY_CPPFLAGS" \
               LDFLAGS="$MY_LDFLAGS" \
               -j$(nproc)
          
          cp trigger-rally ../trigger-rally || cp build/trigger-rally ../trigger-rally || echo "Binary nicht gefunden!"

      - name: Package for R36S
        run: |
          mkdir -p package/TriggerRally
          mv trigger-rally package/TriggerRally/ 2>/dev/null || echo "Binary nicht gefunden!"
          cp -r data package/TriggerRally/
          
          echo '#!/bin/bash' > package/TriggerRally/trigger-rally.sh
          echo 'cd "$(dirname "$0")"' >> package/TriggerRally/trigger-rally.sh
          # Auflösung für R36S (640x480)
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> package/TriggerRally/trigger-rally.sh
          chmod +x package/TriggerRally/trigger-rally.sh
          
      - name: Upload Full Port
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Ready
          path: package/TriggerRally
