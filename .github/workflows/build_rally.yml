name: Build Trigger Rally (Final Linker Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ARM64 Dependencies
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y \
            libsdl2-dev:arm64 \
            libsdl2-image-dev:arm64 \
            libglew-dev:arm64 \
            libphysfs-dev:arm64 \
            libopenal-dev:arm64 \
            libalut-dev:arm64 \
            libtinyxml2-dev:arm64 \
            libglu1-mesa-dev:arm64 \
            libgl1-mesa-dev:arm64 \
            libpng-dev:arm64 \
            libtiff-dev:arm64 \
            libsamplerate0-dev:arm64 \
            libwayland-dev:arm64 \
            libdrm-dev:arm64 \
            libx11-dev:arm64

      - name: Build and Package
        run: |
          cd src
          
          # NEU: --no-as-needed zwingt den Linker, die Bibliotheken wirklich einzubinden.
          # Wir listen alle Bibliotheken auf, die in den Fehlern auftauchten.
          export MY_LDFLAGS="-Wl,--no-as-needed -L/usr/lib/aarch64-linux-gnu -lSDL2 -lSDL2_image -lGLEW -lphysfs -lopenal -lalut -ltinyxml2 -lGL -lGLU -lpthread -lm -ldl -lX11 -lpng -ltiff -lsamplerate -ldrm -lwayland-client"
          export MY_CPPFLAGS="-I./include -I/usr/include -I/usr/include/aarch64-linux-gnu -DNDEBUG -DUNIX -DPACKAGE_VERSION=\\\"0.6.6\\\""

          echo "Starte Build mit erzwungenen Linker-Flags..."

          make clean
          
          # CC/CXX setzen und die Flags direkt übergeben
          make -j1 \
            CC=aarch64-unknown-linux-gnu-gcc \
            CXX=aarch64-unknown-linux-gnu-g++ \
            CPPFLAGS="$MY_CPPFLAGS" \
            LDFLAGS="$MY_LDFLAGS" \
            OPTIMS="-O3 -mtune=cortex-a35"

          # Binary kopieren
          mkdir -p ../package/TriggerRally
          cp trigger-rally ../package/TriggerRally/ 2>/dev/null || cp build/trigger-rally ../package/TriggerRally/
          cp -r ../data ../package/TriggerRally/

      - name: Create Launch Script
        run: |
          cd package/TriggerRally
          echo '#!/bin/bash' > trigger-rally.sh
          echo 'export LD_LIBRARY_PATH=.:$LD_LIBRARY_PATH' >> trigger-rally.sh
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> trigger-rally.sh
          chmod +x trigger-rally.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Working-Binary
          path: package/TriggerRally
