name: Build Trigger Rally (Cross-Compile)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Wir nutzen ein Image, das bereits alle Cross-Compiler und ARM64-Libs enthält
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build
        run: |
          # Die Umgebungsvariablen für Cross-Kompilierung sind hier bereits gesetzt
          mkdir build
          cd build
          
          # CMake konfigurieren
          # Wir nutzen die Compiler, die im Container bereits vorkonfiguriert sind
          cmake -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
                -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
                -DCMAKE_BUILD_TYPE=Release \
                ..
                
          # Kompilieren
          make -j$(nproc)

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: trigger-rally-arm64
          path: build/trigger-rally
