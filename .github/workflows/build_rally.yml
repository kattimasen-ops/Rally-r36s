name: Build Trigger Rally (R36S ARM64 Final)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ARM64 Dependencies & Tools
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y \
            libsdl2-dev:arm64 \
            libsdl2-image-dev:arm64 \
            libglew-dev:arm64 \
            libphysfs-dev:arm64 \
            libopenal-dev:arm64 \
            libalut-dev:arm64 \
            libtinyxml2-dev:arm64 \
            libglu1-mesa-dev:arm64 \
            libgl1-mesa-dev:arm64 \
            libpng-dev:arm64 \
            libtiff-dev:arm64 \
            libsamplerate0-dev:arm64 \
            libwayland-dev:arm64 \
            libdrm-dev:arm64 \
            libx11-dev:arm64 \
            libxcb1-dev:arm64 \
            libpulse-dev:arm64 \
            libasound2-dev:arm64 \
            libffi-dev:arm64 \
            libgbm-dev:arm64 \
            zip

      - name: Build and Package
        run: |
          cd src
          
          # Ordner für den Linker definieren
          export ARM_LIB_PATH=/usr/lib/aarch64-linux-gnu
          export PULSE_LIB_PATH=/usr/lib/aarch64-linux-gnu/pulseaudio
          
          # Harte Linker-Vorgaben, um alle Abhängigkeiten zu erzwingen
          export LDFLAGS="-L$ARM_LIB_PATH -Wl,-rpath-link,$ARM_LIB_PATH:$PULSE_LIB_PATH -Wl,--no-as-needed -lSDL2 -lSDL2_image -lGLEW -lphysfs -lopenal -lalut -ltinyxml2 -lGL -lGLU -lpthread -lm -ldl -lX11 -lxcb -lffi -lpulse -lasound -lgbm -ldrm"
          
          # Include-Pfade für die Header
          export CPPFLAGS="-I./include -I/usr/include -I/usr/include/aarch64-linux-gnu -DNDEBUG -DUNIX -DPACKAGE_VERSION=\\\"0.6.6\\\""

          echo "Starte sauberen Cross-Compile Build..."
          make clean
          
          # Kompilierungsvorgang
          make -j$(nproc) \
            CC=aarch64-unknown-linux-gnu-gcc \
            CXX=aarch64-unknown-linux-gnu-g++ \
            CPPFLAGS="$CPPFLAGS" \
            LDFLAGS="$LDFLAGS" \
            OPTIMS="-O3 -mtune=cortex-a35"

          # Binary aus dem bin-Ordner ins Package kopieren
          mkdir -p ../package/TriggerRally
          cp ../bin/trigger-rally ../package/TriggerRally/
          cp -r ../data ../package/TriggerRally/

      - name: Create Launch Script
        run: |
          cd package/TriggerRally
          echo '#!/bin/bash' > trigger-rally.sh
          echo 'export LD_LIBRARY_PATH=.:$LD_LIBRARY_PATH' >> trigger-rally.sh
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> trigger-rally.sh
          chmod +x trigger-rally.sh

      - name: Zip Artifact (Bypass Filename Errors)
        run: |
          cd package
          echo "Erstelle ZIP-Archiv, um GitHub Upload-Fehler zu umgehen..."
          zip -r TriggerRally-R36S-Ready.zip TriggerRally/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Ready-ZIP
          path: package/TriggerRally-R36S-Ready.zip
