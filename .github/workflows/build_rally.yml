name: Build Trigger Rally (No-Pkg-Config Mode)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ARM64 Dependencies
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y \
            libsdl2-dev:arm64 \
            libsdl2-image-dev:arm64 \
            libglew-dev:arm64 \
            libphysfs-dev:arm64 \
            libopenal-dev:arm64 \
            libalut-dev:arm64 \
            libtinyxml2-dev:arm64 \
            libglu1-mesa-dev:arm64

      - name: Build and Package
        run: |
          cd src
          
          # Wir setzen die Pfade manuell.
          # -I/usr/include/SDL2 ist für die Header.
          # -L/usr/lib/aarch64-linux-gnu ist der Pfad zu den ARM64-Bibliotheken.
          
          export CXXFLAGS="-I./include -I/usr/include/SDL2 -DNDEBUG -DUNIX -DPACKAGE_VERSION=\\\"0.6.6\\\""
          
          # WICHTIG: Die Reihenfolge der -l Bibliotheken ist entscheidend für den Linker.
          # Wir listen SDL2 und SDL2_image explizit.
          export LDFLAGS="-L/usr/lib/aarch64-linux-gnu -lSDL2 -lSDL2_image -lGLEW -lphysfs -lopenal -lalut -ltinyxml2 -lGL -lGLU -lpthread -lm -ldl"

          echo "Starte Build ohne pkg-config..."

          make clean
          
          # Wir rufen make auf und überschreiben die Flags, ohne pkg-config zu fragen.
          make -j$(nproc) \
            CC=aarch64-unknown-linux-gnu-gcc \
            CXX=aarch64-unknown-linux-gnu-g++ \
            CPPFLAGS="$CXXFLAGS" \
            LDFLAGS="$LDFLAGS" \
            OPTIMS="-O3 -mtune=cortex-a35"

          # Binary kopieren
          mkdir -p ../package/TriggerRally
          cp trigger-rally ../package/TriggerRally/ 2>/dev/null || cp build/trigger-rally ../package/TriggerRally/
          cp -r ../data ../package/TriggerRally/

      - name: Create Launch Script
        run: |
          cd package/TriggerRally
          echo '#!/bin/bash' > trigger-rally.sh
          echo 'export LD_LIBRARY_PATH=.:$LD_LIBRARY_PATH' >> trigger-rally.sh
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> trigger-rally.sh
          chmod +x trigger-rally.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Final-Hardcoded
          path: package/TriggerRally
