name: Build Trigger Rally (Linker Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ARM64 Dependencies
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y \
            libsdl2-dev:arm64 \
            libsdl2-image-dev:arm64 \
            libglew-dev:arm64 \
            libphysfs-dev:arm64 \
            libopenal-dev:arm64 \
            libalut-dev:arm64 \
            libtinyxml2-dev:arm64 \
            libglu1-mesa-dev:arm64 \
            pkg-config

      - name: Build and Package
        run: |
          cd src
          
          # 1. FIX: PKG_CONFIG_LIBDIR zwingt pkg-config nur im ARM64-Ordner zu suchen.
          # Das verhindert, dass es Host-Bibliotheken (x86_64) findet.
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/
          export PKG_CONFIG_ALLOW_CROSS=1
          
          # 2. Wir lassen pkg-config die komplette Liste aller Libs inkl. Abhängigkeiten generieren
          # Die "--libs" Option liefert uns jetzt die Liste wie: -lSDL2 -lpulse -lX11 -lasound ...
          SDL_FLAGS=$(pkg-config --cflags --libs sdl2 sdl2_image glew physfs openal alut tinyxml2)
          
          echo "Erkannte Flags: $SDL_FLAGS"

          # 3. Build mit den automatisch ermittelten Flags
          make clean
          
          make -j$(nproc) \
            CC=aarch64-unknown-linux-gnu-gcc \
            CXX=aarch64-unknown-linux-gnu-g++ \
            CPPFLAGS="-I./include -I/usr/include -I/usr/include/aarch64-linux-gnu -DNDEBUG -DUNIX -DPACKAGE_VERSION=\\\"0.6.6\\\" $SDL_FLAGS" \
            LDFLAGS="$SDL_FLAGS" \
            OPTIMS="-O3 -mtune=cortex-a35"

          # Binary kopieren
          mkdir -p ../package/TriggerRally
          cp trigger-rally ../package/TriggerRally/ 2>/dev/null || cp build/trigger-rally ../package/TriggerRally/
          cp -r ../data ../package/TriggerRally/

      - name: Create Launch Script
        run: |
          cd package/TriggerRally
          echo '#!/bin/bash' > trigger-rally.sh
          echo 'export LD_LIBRARY_PATH=.:$LD_LIBRARY_PATH' >> trigger-rally.sh
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> trigger-rally.sh
          chmod +x trigger-rally.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Working-Binary
          path: package/TriggerRally
