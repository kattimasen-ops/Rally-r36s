name: Build Trigger Rally (Makefile)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build
        run: |
          # Bei einem Makefile-Projekt reicht oft ein einfaches 'make'
          # Wir müssen sicherstellen, dass die Compiler-Variablen gesetzt sind
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
          
          # Oft gibt es hier ein 'make all' oder einfach 'make'
          make -j$(nproc)

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: trigger-rally-arm64
          # Hier musst du evtl. anpassen, wo die Binary landet, falls sie nicht im Root liegt
          path: trigger-rally
