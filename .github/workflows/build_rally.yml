
name: Build Trigger Rally (Final Dependency Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ARM64 Dependencies
        run: |
          dpkg --add-architecture arm64
          apt-get update
          # Wir installieren jetzt ALLES, was in den Fehlermeldungen auftauchte
          apt-get install -y \
            libsdl2-dev:arm64 \
            libsdl2-image-dev:arm64 \
            libglew-dev:arm64 \
            libphysfs-dev:arm64 \
            libopenal-dev:arm64 \
            libalut-dev:arm64 \
            libtinyxml2-dev:arm64 \
            libglu1-mesa-dev:arm64 \
            libgl1-mesa-dev:arm64 \
            libpng-dev:arm64 \
            libtiff-dev:arm64 \
            libsamplerate0-dev:arm64 \
            libwayland-dev:arm64 \
            libdrm-dev:arm64 \
            libx11-dev:arm64 \
            libxcb1-dev:arm64 \
            libpulse-dev:arm64 \
            libasound2-dev:arm64 \
            libffi-dev:arm64 \
            libgbm-dev:arm64

      - name: Build and Package
        run: |
          cd src
          
          # Konfiguriere pkg-config für die Cross-Compilation
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/
          export PKG_CONFIG_ALLOW_CROSS=1
          
          # Wir generieren die Flags DYNAMISCH. Das ist sauberer als manuelle Listen.
          # --static stellt sicher, dass alle Unter-Abhängigkeiten (wie -lffi, -lxcb) geladen werden.
          export DEPS_FLAGS=$(pkg-config --cflags --libs --static sdl2 sdl2_image glew physfs openal alut tinyxml2)
          
          echo "Generierte Flags: $DEPS_FLAGS"

          # Fallback: Falls pkg-config was vergisst, fügen wir diese kritischen Libs manuell hinzu
          export LDFLAGS="$DEPS_FLAGS -Wl,--no-as-needed -lX11 -lXcb -lffi -lpulse -lasound -lgbm -ldrm -lGL"
          export CPPFLAGS="-I./include -I/usr/include -I/usr/include/aarch64-linux-gnu -DNDEBUG -DUNIX -DPACKAGE_VERSION=\\\"0.6.6\\\""

          echo "Starte Build..."

          make clean
          
          # Build mit den generierten Flags
          make -j1 \
            CC=aarch64-unknown-linux-gnu-gcc \
            CXX=aarch64-unknown-linux-gnu-g++ \
            CPPFLAGS="$CPPFLAGS" \
            LDFLAGS="$LDFLAGS" \
            OPTIMS="-O3 -mtune=cortex-a35"

          # Binary kopieren
          mkdir -p ../package/TriggerRally
          cp trigger-rally ../package/TriggerRally/ 2>/dev/null || cp build/trigger-rally ../package/TriggerRally/
          cp -r ../data ../package/TriggerRally/

      - name: Create Launch Script
        run: |
          cd package/TriggerRally
          echo '#!/bin/bash' > trigger-rally.sh
          echo 'export LD_LIBRARY_PATH=.:$LD_LIBRARY_PATH' >> trigger-rally.sh
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> trigger-rally.sh
          chmod +x trigger-rally.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Final-Binary
          path: package/TriggerRally
