name: Build Trigger Rally (Verify & Build)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y libsdl2-dev:arm64 libsdl2-image-dev:arm64 libglew-dev:arm64 libphysfs-dev:arm64 libopenal-dev:arm64 libalut-dev:arm64 libtinyxml2-dev:arm64 libglu1-mesa-dev:arm64

      - name: Verify Repository & Setup Paths
        id: setup
        run: |
          # 1. Wir suchen die kritischen Header-Dateien
          # Wir suchen im gesamten Repo, um sicherzugehen
          APP_H=$(find . -name app.h | head -n 1)
          CONFIG_H=$(find . -name config.h | head -n 1)
          
          # 2. Validierung
          if [ -z "$APP_H" ] || [ -z "$CONFIG_H" ]; then
            echo "Fehler: Kritische Header-Dateien (app.h oder config.h) nicht gefunden!"
            exit 1
          fi
          
          # 3. Pfade dynamisch ermitteln
          # Wir brauchen den Pfad, der den 'include' Ordner enthält (root)
          # Da wir uns in src befinden werden, ist ../include der Pfad
          INCLUDE_PATH="$(pwd)/include"
          
          echo "Dateien gefunden:"
          echo "App.h: $APP_H"
          echo "Config.h: $CONFIG_H"
          echo "Setze Include-Pfad auf: $INCLUDE_PATH"
          
          # Variablen für den Build-Schritt exportieren
          echo "INC_PATH=$INCLUDE_PATH" >> $GITHUB_ENV

      - name: Build Binary
        run: |
          cd src
          
          # Wir nutzen den verifizierten Include-Pfad
          # Wir fügen die System-Pfade für SDL2 explizit hinzu, falls nötig
          export CPPFLAGS="-I$INC_PATH -I/usr/aarch64-linux-gnu/include/SDL2 -DNDEBUG -DUNIX"
          export LDFLAGS="-L/usr/aarch64-linux-gnu/lib -lSDL2 -lSDL2_image -lGL -lGLU -lGLEW -lphysfs -lopenal -lalut -ltinyxml2 -lpthread"
          
          echo "Starte Make mit CPPFLAGS: $CPPFLAGS"
          
          make CC=aarch64-unknown-linux-gnu-gcc \
               CXX=aarch64-unknown-linux-gnu-g++ \
               OPTIMS="-O3 -mtune=cortex-a35" \
               CPPFLAGS="$CPPFLAGS" \
               LDFLAGS="$LDFLAGS" \
               -j$(nproc)
          
          cp trigger-rally ../trigger-rally || cp build/trigger-rally ../trigger-rally

      - name: Package for R36S
        run: |
          mkdir -p package/TriggerRally
          mv trigger-rally package/TriggerRally/ 2>/dev/null || echo "Binary nicht gefunden!"
          cp -r data package/TriggerRally/
          
          echo '#!/bin/bash' > package/TriggerRally/trigger-rally.sh
          echo 'cd "$(dirname "$0")"' >> package/TriggerRally/trigger-rally.sh
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> package/TriggerRally/trigger-rally.sh
          chmod +x package/TriggerRally/trigger-rally.sh
          
      - name: Upload Full Port
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Ready
          path: package/TriggerRally
