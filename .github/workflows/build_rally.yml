name: Build Trigger Rally (Corrected)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          # Kein dpkg --add-architecture nötig, wir sind schon im ARM64-Container!
          apt-get update
          apt-get install -y libsdl2-dev libsdl2-image-dev libglew-dev libphysfs-dev libopenal-dev libalut-dev libtinyxml2-dev libglu1-mesa-dev

      - name: Build Binary
        run: |
          cd src
          
          # Wir nutzen NICHT CC=... oder manuelle Pfade. 
          # Dockcross hat die Variablen CC, CXX etc. bereits korrekt gesetzt.
          
          # Falls das Makefile 'pkg-config' nutzt, stellen wir sicher, dass es ARM64 sieht:
          export PKG_CONFIG_ALLOW_CROSS=1
          
          # Einfacher Build-Aufruf
          make -j$(nproc) OPTIMS="-O3 -mtune=cortex-a35"
          
          # Debugging: Schau, wo das Binary liegt, falls es nicht im Root-Verzeichnis ist
          find . -name "trigger-rally"
          
      - name: Package for R36S
        run: |
          mkdir -p package/TriggerRally
          
          # Binary finden und verschieben (wir suchen rekursiv im src Ordner)
          # 'find' gibt den Pfad zurück, wir kopieren das Ergebnis
          BINARY=$(find src -name "trigger-rally" | head -n 1)
          if [ -z "$BINARY" ]; then
            echo "Binary nicht gefunden!" && exit 1
          fi
          cp "$BINARY" package/TriggerRally/
          
          cp -r data package/TriggerRally/
          
          echo '#!/bin/bash' > package/TriggerRally/trigger-rally.sh
          echo 'cd "$(dirname "$0")"' >> package/TriggerRally/trigger-rally.sh
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> package/TriggerRally/trigger-rally.sh
          chmod +x package/TriggerRally/trigger-rally.sh
          
      - name: Upload Full Port
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Ready
          path: package/TriggerRally
