name: Build Trigger Rally (Symlink Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y libsdl2-dev:arm64 libsdl2-image-dev:arm64 libglew-dev:arm64 libphysfs-dev:arm64 libopenal-dev:arm64 libalut-dev:arm64 libtinyxml2-dev:arm64 libglu1-mesa-dev:arm64 pkg-config

      - name: Configure and Link
        run: |
          # 1. Wir legen die Umgebungsvariablen für die ARM64-Libs fest
          export PKG_CONFIG_PATH=/usr/aarch64-linux-gnu/lib/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu
          
          # 2. Wir erstellen den Symlink, der das "SDL2/SDL.h" Problem behebt
          # Wenn der Code SDL2/SDL.h sucht, findet er jetzt den richtigen Pfad
          SDL_DIR=$(find /usr/aarch64-linux-gnu/include -name SDL.h | head -n 1 | xargs dirname)
          echo "SDL gefunden unter: $SDL_DIR"
          
          # Symlink: Wir verknüpfen den Ordner mit sich selbst, damit SDL2/SDL.h korrekt aufgelöst wird
          ln -s $SDL_DIR $SDL_DIR/../SDL2 || echo "Symlink existiert bereits"

      - name: Build Binary
        run: |
          cd src
          
          # 3. Wir nutzen pkg-config, um die Flags sauber abzufragen
          export PKG_CONFIG_PATH=/usr/aarch64-linux-gnu/lib/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu
          
          # Flags holen
          CFLAGS=$(aarch64-linux-gnu-pkg-config --cflags sdl2 SDL2_image)
          LIBS=$(aarch64-linux-gnu-pkg-config --libs sdl2 SDL2_image)
          
          echo "Flags: $CFLAGS"
          
          # Build mit den korrekten Pfaden und dem localen include
          make CC=aarch64-unknown-linux-gnu-gcc \
               CXX=aarch64-unknown-linux-gnu-g++ \
               OPTIMS="-O3 -mtune=cortex-a35" \
               CPPFLAGS="-I. -Iinclude $CFLAGS -DNDEBUG -DUNIX" \
               LDFLAGS="$LIBS -lGL -lGLU -lGLEW -lphysfs -lopenal -lalut -ltinyxml2 -lpthread" \
               -j$(nproc)
          
          cp trigger-rally ../trigger-rally || cp build/trigger-rally ../trigger-rally

      - name: Package for R36S
        run: |
          mkdir -p package/TriggerRally
          mv trigger-rally package/TriggerRally/ 2>/dev/null || echo "Binary nicht gefunden!"
          cp -r data package/TriggerRally/
          echo '#!/bin/bash' > package/TriggerRally/trigger-rally.sh
          echo 'cd "$(dirname "$0")"' >> package/TriggerRally/trigger-rally.sh
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> package/TriggerRally/trigger-rally.sh
          chmod +x package/TriggerRally/trigger-rally.sh
          
      - name: Upload Full Port
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Ready
          path: package/TriggerRally
