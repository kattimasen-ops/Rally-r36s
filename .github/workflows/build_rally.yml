name: Build Trigger Rally (Injection Method)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y libsdl2-dev:arm64 libsdl2-image-dev:arm64 libglew-dev:arm64 libphysfs-dev:arm64 libopenal-dev:arm64 libalut-dev:arm64 libtinyxml2-dev:arm64 libglu1-mesa-dev:arm64

      - name: Inject SDL2 Headers
        run: |
          # Finde den Pfad, wo die arm64 Header liegen
          # Wir suchen nach der Datei 'SDL.h'
          SDL_INC_PATH=$(find /usr/aarch64-linux-gnu -name SDL.h -exec dirname {} \;)
          
          # Erstelle den Ordner, den der Code erwartet
          mkdir -p src/include/SDL2
          
          # Kopiere alle SDL2 Header in den Projekt-include-Ordner
          # Das behebt das "No such file or directory" Problem garantiert
          cp -L $SDL_INC_PATH/*.h src/include/SDL2/
          
          # Das gleiche für SDL_image
          IMG_INC_PATH=$(find /usr/aarch64-linux-gnu -name SDL_image.h -exec dirname {} \;)
          cp -L $IMG_INC_PATH/*.h src/include/SDL2/
          
          echo "Header erfolgreich in src/include/SDL2 injiziert."

      - name: Build Binary
        run: |
          cd src
          
          # Wir setzen nur die Flags, die der Linker braucht (die Header findet er jetzt lokal)
          export LDFLAGS="-L/usr/aarch64-linux-gnu/lib -L/usr/lib/aarch64-linux-gnu -lSDL2 -lSDL2_image -lGL -lGLU -lGLEW -lphysfs -lopenal -lalut -ltinyxml2 -lpthread"
          
          make CC=aarch64-unknown-linux-gnu-gcc \
               CXX=aarch64-unknown-linux-gnu-g++ \
               OPTIMS="-O3 -mtune=cortex-a35" \
               LDFLAGS="$LDFLAGS" \
               -j$(nproc)
          
          # Binary kopieren (Trigger Rally scheint es in build/ oder root zu erstellen)
          cp trigger-rally ../trigger-rally || cp build/trigger-rally ../trigger-rally || echo "Binary nicht gefunden!"

      - name: Package for R36S
        run: |
          mkdir -p package/TriggerRally
          mv trigger-rally package/TriggerRally/ 2>/dev/null || echo "Binary nicht gefunden!"
          cp -r data package/TriggerRally/
          
          echo '#!/bin/bash' > package/TriggerRally/trigger-rally.sh
          echo 'cd "$(dirname "$0")"' >> package/TriggerRally/trigger-rally.sh
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> package/TriggerRally/trigger-rally.sh
          chmod +x package/TriggerRally/trigger-rally.sh
          
      - name: Upload Full Port
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Ready
          path: package/TriggerRally
