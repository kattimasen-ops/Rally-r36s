name: Build Trigger Rally (Robust)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update
          # Wir installieren pkg-config, um Header-Pfade automatisch zu finden
          apt-get install -y libsdl2-dev libsdl2-image-dev libglew-dev libphysfs-dev libopenal-dev libalut-dev libtinyxml2-dev libglu1-mesa-dev pkg-config

      - name: Diagnose & Build
        run: |
          cd src
          
          # 1. SAUBERER START
          make clean
          
          # 2. PFAD-DIAGNOSE
          # Wir suchen, wo SDL.h wirklich liegt. Wenn das leer ist, finden wir den Fehler sofort.
          echo "Suche nach SDL.h..."
          find /usr/aarch64-linux-gnu -name SDL.h
          
          # 3. VARIABLEN EXPORTIEREN (nicht nur an Make übergeben)
          # Wir nutzen pkg-config, um die absolut korrekten Include-Pfade zu generieren.
          export SDL_CFLAGS=$(aarch64-linux-gnu-pkg-config --cflags sdl2)
          export SDL_LIBS=$(aarch64-linux-gnu-pkg-config --libs sdl2)
          
          echo "Gefundene SDL_CFLAGS: $SDL_CFLAGS"
          
          # 4. DAS MAKE-COMMAND
          # Wir überschreiben die Variablen direkt beim Aufruf. 
          # Wir nutzen 'override', um sicherzustellen, dass das Makefile nicht dazwischenfunkt.
          # Wir fügen -I/usr/aarch64-linux-gnu/include/SDL2 explizit hinzu als Fallback.
          make -j$(nproc) \
            CC=aarch64-unknown-linux-gnu-gcc \
            CXX=aarch64-unknown-linux-gnu-g++ \
            CPPFLAGS="-I./include $SDL_CFLAGS -I/usr/aarch64-linux-gnu/include/SDL2 -DNDEBUG -DUNIX" \
            LDFLAGS="$SDL_LIBS -L/usr/aarch64-linux-gnu/lib/aarch64-linux-gnu" \
            OPTIMS="-O3 -mtune=cortex-a35"

      - name: Package for R36S
        run: |
          mkdir -p package/TriggerRally
          cp src/trigger-rally package/TriggerRally/ 2>/dev/null || cp src/build/trigger-rally package/TriggerRally/
          cp -r data package/TriggerRally/
          
          # Start-Skript
          echo '#!/bin/bash' > package/TriggerRally/trigger-rally.sh
          echo 'cd "$(dirname "$0")"' >> package/TriggerRally/trigger-rally.sh
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> package/TriggerRally/trigger-rally.sh
          chmod +x package/TriggerRally/trigger-rally.sh
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Robust
          path: package/TriggerRally
