name: Build Trigger Rally (Final Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y libsdl2-dev libsdl2-image-dev libglew-dev libphysfs-dev libopenal-dev libalut-dev libtinyxml2-dev libglu1-mesa-dev pkg-config

      - name: Build and Package
        run: |
          cd src
          
          # 1. SETUP FÜR CROSS-COMPILING PKG-CONFIG
          # Wir weisen pkg-config an, nur die ARM64-Dateien zu finden
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/
          export PKG_CONFIG_ALLOW_CROSS=1
          
          # Test: Prüfen, ob pkg-config die SDL2 Datei findet
          echo "Prüfe SDL2 Pfade..."
          pkg-config --cflags sdl2 || echo "Warnung: pkg-config findet sdl2 nicht!"

          # 2. FLAGS GENERIEREN
          # Wir nutzen jetzt das normale pkg-config, das durch unsere Exports oben nun "ARM64-fähig" ist.
          SDL_CFLAGS=$(pkg-config --cflags sdl2 sdl2_image glew physfs openal alut tinyxml2)
          SDL_LIBS=$(pkg-config --libs sdl2 sdl2_image glew physfs openal alut tinyxml2)
          
          echo "Verwendete CFLAGS: $SDL_CFLAGS"

          # 3. BUILD
          # Wir nutzen explizit KEIN -I/usr/include, um die Host-Header-Vergiftung zu vermeiden.
          make clean
          make -j$(nproc) \
            CC=aarch64-unknown-linux-gnu-gcc \
            CXX=aarch64-unknown-linux-gnu-g++ \
            CPPFLAGS="-I./include $SDL_CFLAGS -DNDEBUG -DUNIX" \
            LDFLAGS="$SDL_LIBS" \
            OPTIMS="-O3 -mtune=cortex-a35"

          # 4. PACKAGE
          mkdir -p ../package/TriggerRally
          cp trigger-rally ../package/TriggerRally/ 2>/dev/null || cp build/trigger-rally ../package/TriggerRally/
          cp -r ../data ../package/TriggerRally/

      - name: Create Launch Script
        run: |
          cd package/TriggerRally
          echo '#!/bin/bash' > trigger-rally.sh
          echo 'cd "$(dirname "$0")"' >> trigger-rally.sh
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> trigger-rally.sh
          chmod +x trigger-rally.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Fixed
          path: package/TriggerRally
