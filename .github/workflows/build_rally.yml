name: Build Trigger Rally (GNUmakefile)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build
        run: |
          # 1. Wechsel in den Quellcode-Ordner
          cd src
          
          # 2. Den Build mit make starten
          # Wir übergeben die Compiler-Variablen, falls das Makefile sie nicht automatisch erkennt
          make CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ -j$(nproc)
          
          # 3. Das Binary aus dem src-Ordner (oder wo auch immer es landet) in den Root kopieren
          # Wir suchen nach einer Datei, die 'trigger-rally' heißt
          cp trigger-rally ../ || cp build/trigger-rally ../ || echo "Binary nicht gefunden!"

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: trigger-rally-arm64
          path: trigger-rally
