name: Build Trigger Rally (Final Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build
        run: |
          cd src
          
          # Wir definieren die korrekten Compiler-Namen für diesen Container
          # Und wir überschreiben OPTIMS, um -march=native zu eliminieren
          make CC=aarch64-unknown-linux-gnu-gcc \
               CXX=aarch64-unknown-linux-gnu-g++ \
               OPTIMS="-O3 -mtune=cortex-a35" \
               -j$(nproc)
          
          # Binary suchen und kopieren
          cp trigger-rally ../ || cp build/trigger-rally ../ || echo "Binary nicht gefunden!"

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: trigger-rally-arm64
          path: trigger-rally
