name: Build Trigger Rally (Full Port)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update
          # Wir installieren alle Dev-Libs in der richtigen Architektur
          apt-get install -y libsdl2-dev libsdl2-image-dev libglew-dev libphysfs-dev libopenal-dev libalut-dev libtinyxml2-dev libglu1-mesa-dev pkg-config

      - name: Build Binary
        run: |
          cd src
          
          # Wir nutzen pkg-config, um die Pfade zu den Libs automatisch zu finden.
          # Das verhindert den "SDL_config.h" Fehler, da er nicht raten muss.
          export CFLAGS="$(pkg-config --cflags sdl2 sdl2_image glu glew physfs openal freealut tinyxml2)"
          export LDFLAGS="$(pkg-config --libs sdl2 sdl2_image glu glew physfs openal freealut tinyxml2)"
          
          make CC=aarch64-unknown-linux-gnu-gcc \
               CXX=aarch64-unknown-linux-gnu-g++ \
               OPTIMS="-O3 -mtune=cortex-a35" \
               CFLAGS="$CFLAGS" \
               LDFLAGS="$LDFLAGS" \
               -j$(nproc)
          
          # Binary suchen
          cp trigger-rally ../trigger-rally || cp build/trigger-rally ../trigger-rally

      - name: Package for R36S
        run: |
          # Ordnerstruktur erstellen
          mkdir -p package/TriggerRally
          
          # Binary verschieben
          mv trigger-rally package/TriggerRally/
          
          # Data Ordner kopieren (behält die Struktur bei)
          cp -r data package/TriggerRally/
          
          # Start-Skript erstellen
          echo '#!/bin/bash' > package/TriggerRally/trigger-rally.sh
          echo 'cd "$(dirname "$0")"' >> package/TriggerRally/trigger-rally.sh
          echo './trigger-rally --data ./data' >> package/TriggerRally/trigger-rally.sh
          chmod +x package/TriggerRally/trigger-rally.sh
          
      - name: Upload Full Port
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Ready
          path: package/TriggerRally
