name: Build Trigger Rally (The "No-Guessing" Way)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ARM64 Dependencies
        run: |
          # 1. Multi-Arch für ARM64 aktivieren
          dpkg --add-architecture arm64
          apt-get update
          # 2. Wir installieren explizit die ARM64 Versionen der Libs
          apt-get install -y \
            libsdl2-dev:arm64 \
            libsdl2-image-dev:arm64 \
            libglew-dev:arm64 \
            libphysfs-dev:arm64 \
            libopenal-dev:arm64 \
            libalut-dev:arm64 \
            libtinyxml2-dev:arm64 \
            libglu1-mesa-dev:arm64

      - name: Build and Package
        run: |
          cd src
          
          # SYSROOT ist in dockcross automatisch gesetzt (z.B. /usr/aarch64-linux-gnu)
          # Wir bauen unsere Pfade exakt zusammen
          export MY_INCLUDE="-I./include -I${SYSROOT}/usr/include -I${SYSROOT}/usr/include/SDL2"
          export MY_LIB="-L${SYSROOT}/usr/lib/aarch64-linux-gnu -lSDL2 -lSDL2_image -lGLEW -lphysfs -lopenal -lalut -ltinyxml2 -lGL -lGLU -lpthread"

          echo "Bauen mit Include-Pfaden: $MY_INCLUDE"

          make clean
          make -j$(nproc) \
            CC=aarch64-unknown-linux-gnu-gcc \
            CXX=aarch64-unknown-linux-gnu-g++ \
            CPPFLAGS="$MY_INCLUDE -DNDEBUG -DUNIX" \
            LDFLAGS="$MY_LIB" \
            OPTIMS="-O3 -mtune=cortex-a35"

          # Binary kopieren
          mkdir -p ../package/TriggerRally
          cp trigger-rally ../package/TriggerRally/ 2>/dev/null || cp build/trigger-rally ../package/TriggerRally/
          cp -r ../data ../package/TriggerRally/

      - name: Create Launch Script
        run: |
          cd package/TriggerRally
          echo '#!/bin/bash' > trigger-rally.sh
          echo 'export LD_LIBRARY_PATH=.:$LD_LIBRARY_PATH' >> trigger-rally.sh
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> trigger-rally.sh
          chmod +x trigger-rally.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Final-Fixed
          path: package/TriggerRally
