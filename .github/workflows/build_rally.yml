name: Build Trigger Rally (Dynamic)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y libsdl2-dev libsdl2-image-dev libglew-dev libphysfs-dev libopenal-dev libalut-dev libtinyxml2-dev libglu1-mesa-dev pkg-config

      - name: Build and Package
        run: |
          # 1. Dynamische Pfad-Suche für SDL2
          # Wir suchen die Datei SDL.h und leiten den Include-Pfad ab
          SDL_H_PATH=$(find /usr -name SDL.h | head -n 1)
          if [ -z "$SDL_H_PATH" ]; then
            echo "Fehler: SDL.h konnte nicht gefunden werden!"
            exit 1
          fi
          # Wir extrahieren das übergeordnete Verzeichnis von /SDL2/SDL.h
          SDL_INCLUDE_DIR=$(dirname $(dirname "$SDL_H_PATH"))
          echo "Gefundenes SDL Include Verzeichnis: $SDL_INCLUDE_DIR"

          # 2. Umgebungsvariablen setzen
          export CPPFLAGS="-I./include -I$SDL_INCLUDE_DIR -DNDEBUG -DUNIX"
          # Wir nutzen pkg-config, um die korrekten Linker-Flags zu erhalten
          export LDFLAGS=$(pkg-config --libs sdl2 sdl2_image glew physfs openal alut tinyxml2)

          # 3. Build
          cd src
          make clean
          make -j$(nproc) \
            CC=aarch64-unknown-linux-gnu-gcc \
            CXX=aarch64-unknown-linux-gnu-g++ \
            CPPFLAGS="$CPPFLAGS" \
            LDFLAGS="$LDFLAGS" \
            OPTIMS="-O3 -mtune=cortex-a35"

          # 4. Binary prüfen und verschieben
          BINARY=$(find . -maxdepth 2 -name "trigger-rally" | head -n 1)
          if [ -z "$BINARY" ]; then
            echo "Binary wurde nicht erstellt!"
            exit 1
          fi

          mkdir -p ../package/TriggerRally
          cp "$BINARY" ../package/TriggerRally/
          cp -r ../data ../package/TriggerRally/

      - name: Create Launch Script
        run: |
          cd package/TriggerRally
          echo '#!/bin/bash' > trigger-rally.sh
          echo 'cd "$(dirname "$0")"' >> trigger-rally.sh
          # Ggf. lib-pfade setzen, falls das OS die libs nicht findet
          echo 'export LD_LIBRARY_PATH=.:$LD_LIBRARY_PATH' >> trigger-rally.sh
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> trigger-rally.sh
          chmod +x trigger-rally.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Final
          path: package/TriggerRally
