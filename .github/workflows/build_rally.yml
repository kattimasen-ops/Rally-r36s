name: Build Trigger Rally (Diagnostic & Build)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ARM64 Dependencies
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y \
            libsdl2-dev:arm64 \
            libsdl2-image-dev:arm64 \
            libglew-dev:arm64 \
            libphysfs-dev:arm64 \
            libopenal-dev:arm64 \
            libalut-dev:arm64 \
            libtinyxml2-dev:arm64 \
            libglu1-mesa-dev:arm64 \
            pkg-config

      - name: Locate Libraries and Build
        run: |
          cd src
          
          # 1. DIAGNOSE: Finde, wo die .pc Dateien wirklich liegen
          echo "Suche nach sdl2.pc..."
          PC_PATH=$(find /usr/lib -name "sdl2.pc" | head -n 1 | xargs dirname)
          
          if [ -z "$PC_PATH" ]; then
            echo "FEHLER: sdl2.pc wurde nicht gefunden! Installierte Pakete prüfen..."
            ls -R /usr/lib/aarch64-linux-gnu/pkgconfig || echo "Kein pkgconfig Ordner gefunden."
            exit 1
          fi
          
          echo "Gefundener Pfad: $PC_PATH"
          export PKG_CONFIG_PATH=$PC_PATH
          export PKG_CONFIG_SYSROOT_DIR=/
          export PKG_CONFIG_ALLOW_CROSS=1
          
          # 2. Bauen mit den gefundenen Informationen
          # Wir nutzen --static für SDL2, damit der Linker die Abhängigkeiten 
          # direkt mit einbaut und die 'undefined reference' Fehler verschwinden.
          SDL_FLAGS=$(pkg-config --cflags --libs --static sdl2 sdl2_image glew physfs openal alut tinyxml2)
          
          echo "Flags: $SDL_FLAGS"

          make clean
          make -j$(nproc) \
            CC=aarch64-unknown-linux-gnu-gcc \
            CXX=aarch64-unknown-linux-gnu-g++ \
            CPPFLAGS="-I./include -I/usr/include -DNDEBUG -DUNIX -DPACKAGE_VERSION=\\\"0.6.6\\\" $SDL_FLAGS" \
            LDFLAGS="$SDL_FLAGS" \
            OPTIMS="-O3 -mtune=cortex-a35"

          # Binary kopieren
          mkdir -p ../package/TriggerRally
          cp trigger-rally ../package/TriggerRally/ 2>/dev/null || cp build/trigger-rally ../package/TriggerRally/
          cp -r ../data ../package/TriggerRally/

      - name: Create Launch Script
        run: |
          cd package/TriggerRally
          echo '#!/bin/bash' > trigger-rally.sh
          echo 'export LD_LIBRARY_PATH=.:$LD_LIBRARY_PATH' >> trigger-rally.sh
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> trigger-rally.sh
          chmod +x trigger-rally.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Final-Attempt
          path: package/TriggerRally
