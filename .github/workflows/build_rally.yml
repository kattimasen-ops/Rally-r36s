name: Build Trigger Rally (Manual Flags)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ARM64 Dependencies
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y \
            libsdl2-dev:arm64 \
            libsdl2-image-dev:arm64 \
            libglew-dev:arm64 \
            libphysfs-dev:arm64 \
            libopenal-dev:arm64 \
            libalut-dev:arm64 \
            libtinyxml2-dev:arm64 \
            libglu1-mesa-dev:arm64

      - name: Build and Package
        run: |
          cd src
          
          # Wir verzichten komplett auf pkg-config. 
          # Wir definieren die Pfade fest, basierend auf dem Standard-Layout 
          # der Debian/Ubuntu-Multiarch-Installation.
          
          # SDL2 Header liegen standardmäßig hier:
          export SDL_INCLUDE="-I/usr/include/SDL2"
          
          # Die Bibliotheken liegen in diesem Pfad:
          export LIBS_PATH="-L/usr/lib/aarch64-linux-gnu"
          
          # Die notwendigen Bibliotheken:
          export LIBS_LINK="-lSDL2 -lSDL2_image -lGLEW -lphysfs -lopenal -lalut -ltinyxml2 -lGL -lGLU -lpthread"

          echo "Starte Build ohne pkg-config..."

          make clean
          
          # Wir übergeben die Flags explizit. Wir lassen die SYSROOT-Flags WEG,
          # damit der Compiler seine eigenen System-Header (features.h) findet.
          make -j$(nproc) \
            CC=aarch64-unknown-linux-gnu-gcc \
            CXX=aarch64-unknown-linux-gnu-g++ \
            CPPFLAGS="-I./include $SDL_INCLUDE -DNDEBUG -DUNIX" \
            LDFLAGS="$LIBS_PATH $LIBS_LINK" \
            OPTIMS="-O3 -mtune=cortex-a35"

          # Binary kopieren
          mkdir -p ../package/TriggerRally
          cp trigger-rally ../package/TriggerRally/ 2>/dev/null || cp build/trigger-rally ../package/TriggerRally/
          cp -r ../data ../package/TriggerRally/

      - name: Create Launch Script
        run: |
          cd package/TriggerRally
          echo '#!/bin/bash' > trigger-rally.sh
          echo 'export LD_LIBRARY_PATH=.:$LD_LIBRARY_PATH' >> trigger-rally.sh
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> trigger-rally.sh
          chmod +x trigger-rally.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Final-Manual
          path: package/TriggerRally
