name: Build Trigger Rally (Final Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y libsdl2-dev libsdl2-image-dev libglew-dev libphysfs-dev libopenal-dev libfreealut-dev libtinyxml2-dev libglu1-mesa-dev

      - name: Build
        run: |
          cd src
          
          # Wir definieren Compiler und Flags, und umgehen -march=native
          make CC=aarch64-unknown-linux-gnu-gcc \
               CXX=aarch64-unknown-linux-gnu-g++ \
               OPTIMS="-O3 -mtune=cortex-a35" \
               -j$(nproc)
          
          # Binary in den Root kopieren
          cp trigger-rally ../ || cp build/trigger-rally ../ || echo "Binary nicht gefunden!"

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: trigger-rally-arm64
          path: trigger-rally
