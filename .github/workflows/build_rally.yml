name: Build Trigger Rally (src/ Build)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build
        run: |
          # 1. Wechsel in das Verzeichnis mit dem Quellcode
          cd src
          
          # 2. Prüfen, ob ein Makefile existiert
          if [ -f "Makefile" ]; then
            echo "Makefile in src/ gefunden! Baue jetzt..."
            # Wir definieren die Compiler-Variablen explizit
            make CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ -j$(nproc)
          else
            echo "Kein Makefile in src/ gefunden! Inhalt von src/:"
            ls -F
            exit 1
          fi
          
          # 3. Wenn erfolgreich, die Binary in den Root kopieren
          # Damit der Upload-Schritt sie findet
          cp trigger-rally ../

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: trigger-rally-arm64
          path: trigger-rally
