name: Build Trigger Rally (R36S)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Dockcross liefert alles, was wir für ARM64 brauchen
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y \
            libsdl2-dev \
            libsdl2-image-dev \
            libglew-dev \
            libphysfs-dev \
            libopenal-dev \
            libalut-dev \
            libtinyxml2-dev \
            libglu1-mesa-dev \
            pkg-config

      - name: Build Binary
        run: |
          cd src
          
          # WICHTIG: Wir setzen den korrekten Pfad für pkg-config, 
          # damit er die ARM64-Bibliotheken findet, nicht die x86-Bibliotheken.
          export PKG_CONFIG_PATH=/usr/aarch64-linux-gnu/lib/aarch64-linux-gnu/pkgconfig
          
          # Wir definieren die Flags, um die Header-Probleme zu lösen.
          # -I/usr/aarch64-linux-gnu/include sorgt dafür, dass <SDL2/SDL.h> gefunden wird.
          # Wir nutzen 'override', damit das Makefile unsere Werte nicht verwirft.
          
          make -j$(nproc) \
            CPPFLAGS="-I./include -I/usr/aarch64-linux-gnu/include -DNDEBUG -DUNIX" \
            LDFLAGS="-L/usr/aarch64-linux-gnu/lib/aarch64-linux-gnu" \
            OPTIMS="-O3 -mtune=cortex-a35"
            
          # Prüfen, ob das Binary existiert
          ls -l trigger-rally

      - name: Package for R36S
        run: |
          mkdir -p package/TriggerRally
          
          # Binary kopieren
          cp src/trigger-rally package/TriggerRally/
          
          # Daten kopieren
          cp -r data package/TriggerRally/
          
          # Start-Skript erstellen
          echo '#!/bin/bash' > package/TriggerRally/trigger-rally.sh
          echo 'cd "$(dirname "$0")"' >> package/TriggerRally/trigger-rally.sh
          # Hier ggf. Parameter anpassen, falls das Spiel Auflösungsprobleme hat
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> package/TriggerRally/trigger-rally.sh
          chmod +x package/TriggerRally/trigger-rally.sh
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S
          path: package/TriggerRally
