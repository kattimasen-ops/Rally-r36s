name: Build Trigger Rally (Dynamic Paths)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y libsdl2-dev:arm64 libsdl2-image-dev:arm64 libglew-dev:arm64 libphysfs-dev:arm64 libopenal-dev:arm64 libalut-dev:arm64 libtinyxml2-dev:arm64 libglu1-mesa-dev:arm64 pkg-config

      - name: Build Binary
        run: |
          cd src
          
          # Konfiguriere pkg-config für den Cross-Compiler
          export PKG_CONFIG_PATH=/usr/aarch64-linux-gnu/lib/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu
          export PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1
          
          # Hole die exakten Pfade für die ARM64-Libs
          # Wir nutzen --cflags-only-I, um nur die Pfade zu bekommen
          ARM_CFLAGS=$(aarch64-linux-gnu-pkg-config --cflags-only-I sdl2 SDL2_image glu glew physfs openal freealut tinyxml2)
          ARM_LIBS=$(aarch64-linux-gnu-pkg-config --libs sdl2 SDL2_image glu glew physfs openal freealut tinyxml2)
          
          # Bauen
          make CC=aarch64-unknown-linux-gnu-gcc \
               CXX=aarch64-unknown-linux-gnu-g++ \
               OPTIMS="-O3 -mtune=cortex-a35" \
               CPPFLAGS="-I./include $ARM_CFLAGS -DNDEBUG -DUNIX" \
               LDFLAGS="$ARM_LIBS" \
               -j$(nproc)
          
          cp trigger-rally ../trigger-rally || cp build/trigger-rally ../trigger-rally || echo "Binary nicht gefunden!"

      - name: Package for R36S
        run: |
          mkdir -p package/TriggerRally
          mv trigger-rally package/TriggerRally/ 2>/dev/null || echo "Binary nicht gefunden!"
          cp -r data package/TriggerRally/
          
          echo '#!/bin/bash' > package/TriggerRally/trigger-rally.sh
          echo 'cd "$(dirname "$0")"' >> package/TriggerRally/trigger-rally.sh
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> package/TriggerRally/trigger-rally.sh
          chmod +x package/TriggerRally/trigger-rally.sh
          
      - name: Upload Full Port
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Ready
          path: package/TriggerRally
