name: Build Trigger Rally (Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dockcross/linux-arm64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update
          # Wir installieren für die Zielarchitektur
          apt-get install -y libsdl2-dev libsdl2-image-dev libglew-dev libphysfs-dev libopenal-dev libalut-dev libtinyxml2-dev libglu1-mesa-dev pkg-config

      - name: Build and Package
        run: |
          cd src
          
          # 1. SAUBERE UMWELT:
          # Wir löschen alle alten Pfade und zwingen pkg-config dazu, 
          # NUR in den ARM64-Pfaden zu suchen.
          export PKG_CONFIG_PATH=""
          export PKG_CONFIG_LIBDIR="/usr/aarch64-linux-gnu/lib/aarch64-linux-gnu/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig"
          export PKG_CONFIG="aarch64-linux-gnu-pkg-config"

          # 2. HOL DIR DIE FLAGS:
          # pkg-config liefert uns jetzt exakt die richtigen Pfade zu den ARM64-Headern.
          # Wir benutzen KEIN -I/usr/include mehr!
          SDL_CFLAGS=$(aarch64-linux-gnu-pkg-config --cflags sdl2 sdl2_image glew physfs openal alut tinyxml2)
          SDL_LIBS=$(aarch64-linux-gnu-pkg-config --libs sdl2 sdl2_image glew physfs openal alut tinyxml2)

          echo "DEBUG FLAGS: $SDL_CFLAGS"

          # 3. BUILD:
          # Wir benutzen nur noch das, was uns pkg-config gibt + ./include
          make clean
          make -j$(nproc) \
            CC=aarch64-unknown-linux-gnu-gcc \
            CXX=aarch64-unknown-linux-gnu-g++ \
            CPPFLAGS="-I./include $SDL_CFLAGS -DNDEBUG -DUNIX" \
            LDFLAGS="$SDL_LIBS" \
            OPTIMS="-O3 -mtune=cortex-a35"

          # 4. PACKAGE:
          mkdir -p ../package/TriggerRally
          cp trigger-rally ../package/TriggerRally/ 2>/dev/null || cp build/trigger-rally ../package/TriggerRally/
          cp -r ../data ../package/TriggerRally/

      - name: Create Launch Script
        run: |
          cd package/TriggerRally
          echo '#!/bin/bash' > trigger-rally.sh
          echo 'cd "$(dirname "$0")"' >> trigger-rally.sh
          echo './trigger-rally --width 640 --height 480 --fullscreen' >> trigger-rally.sh
          chmod +x trigger-rally.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriggerRally-R36S-Final
          path: package/TriggerRally
